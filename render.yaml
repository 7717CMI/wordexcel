services:
  - type: web
    name: wordexcel-processor
    # The build needs both Node (to produce the Next.js static export) and
    # Python (to run FastAPI). Render's native `python` runtime does not
    # provide npm, so the multi-stage Dockerfile is the supported path.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      # Set this in the Render dashboard; sync:false keeps it out of the repo.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Uvicorn binds to $PORT, which Render injects.
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_MODEL
        value: deepseek-chat
      - key: MAX_FILE_SIZE
        value: "52428800"
